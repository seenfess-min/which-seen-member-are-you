
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which SEEN Member Are You?</title>
<style>
.member-photo {
  width: 180px;
  height: 180px;
  margin: 20px auto;
  overflow: hidden;
  border-radius: 18px;
  border: 3px solid #9ed8ff;
  box-shadow: 0 0 18px rgba(100, 190, 255, 0.35);
}

.member-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  color: #20396e;
  background: linear-gradient(145deg, #dceaff, #c9c9ff, #f0f5ff);
}

.card {
  width: 100%;
  max-width: 470px;
  padding: 25px 20px;
  background: rgba(255,255,255,.92);
  border: 2px solid white;
  border-radius: 25px;
  box-shadow: 0 12px 35px #627dc52b;
  text-align: center;
}

.tag {
  display: inline-block;
  padding: 7px 12px;
  background: #e5edff;
  color: #294b9b;
  border-radius: 20px;
  font-size: 11px;
  letter-spacing: 1px;
  font-weight: bold;
}

h1 {
  color: #23458d;
  font-size: clamp(28px, 7vw, 36px);
  line-height: 1.15;
  margin: 18px 0 12px;
}

p { line-height: 1.65; }

.sub {
  color: #68799f;
  font-size: 13px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 14px;
  background: #3155a8;
  color: white;
  font-size: 14px;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
  line-height: 1.45;
}

button.secondary {
  background: #e6edff;
  color: #284788;
  border: 1px solid #c9d8ff;
}

button.answer {
  text-align: left;
  background: white;
  color: #2b416f;
  border: 1.5px solid #d5e0fa;
}

button.answer:active {
  background: #eaf0ff;
}

.progress {
  height: 7px;
  margin: 18px 0;
  overflow: hidden;
  background: #e1e8fa;
  border-radius: 10px;
}

#bar {
  width: 0;
  height: 100%;
  background: #4268bd;
  transition: width .2s;
}

.question {
  margin: 22px 0;
  font-size: 20px;
  line-height: 1.45;
  font-weight: bold;
}

.result-icon { font-size: 48px; }

.result-title {
  margin: 12px 0;
  color: #23458d;
  font-size: 30px;
}

.result-desc {
  color: #53658d;
  font-size: 14px;
}

.small {
  margin-top: 24px;
  color: #173b8f;
  font-size: 12px;
}

.hidden { display: none; }
</style>
</head>

<body>
<main class="card">

  <div class="tag">✦ SEEN PERSONALITY QUIZ ✦</div>

  <section id="home">
    <h1>which seen<br>member are you?</h1>
    <p class="sub">
      pagi yang hangat, siang yang penuh energi,
      senja yang tenang, atau malam yang ramai? 
    </p>
    <p>
      Jawab 10 pertanyaan dan temukan member SEEN
      yang paling cocok dengan kepribadianmu!
    </p>
    <button onclick="startQuiz()">START ♡</button>
  </section>

  <section id="quiz" class="hidden">
    <p class="sub" id="counter"></p>
    <div class="progress"><div id="bar"></div></div>
    <div class="question" id="question"></div>
    <div id="answers"></div>
  </section>

  <section id="result" class="hidden">
    <div class="result-icon" id="resultIcon"></div>
    <p class="sub">HASIL KUIS KAMU ADALAH...</p>
    <h2 class="result-title" id="resultName"></h2>
    <div class="tag" id="resultTag"></div>
    <p class="result-desc" id="resultDesc"></p>
    <p id="resultQuote"></p>
    <button onclick="shareResult()">bagikan hasil ke X ↗</button>
    <button class="secondary" onclick="startQuiz()">coba lagi ♡</button>
  </section>

  <p class="small">♡ made by @seenfessid 💙</p>
</main>

<script>

    photo.src = memberPhotos[memberName];

}

    quote: "“YA UDAH BILANG AJA, NGAPAIN DIPIKIRIN LAMA-LAMA?”"
  },
  albian: {
    name: "ALBIAN",

    quote: "“aku kenapa, ya? gatau juga.”"
  },
  noel: {
    name: "NOEL",
    icon: "🌙",
    tag: "THE FEISTY NIGHT",
    desc: "Kamu punya sisi galak yang justru menghibur! Gampang terpancing kalau teman mulai usil, suka adu mulut bercanda, dan reaksimu bisa jadi hiburan tersendiri. Apalagi kalau ketemu orang yang sama-sama suka cari gara-gara. Ribut sedikit? Sudah biasa!",
    quote: "BUKAN AKU YANG MULAI, DIA DULUAN“—!!”"

const questions = [
  {
    q: "1. Kalau lagi kumpul bareng teman, kamu biasanya...",
    a: [
      ["dndy", "Paling banyak cerita dan berbagi informasi"],
      ["jason", "Bikin suasana ramai dengan energi sendiri"],

    ]
  },

  {

    ]
  },
  {
    q: "4. Temanmu menyebalkan banget hari ini. Kamu...",
    a: [
      ["dndy", "Menjelaskan panjang lebar kenapa dia salah"],

    ]

  {

    a: [
      ["dndy", "Si perhatian yang suka mengingatkan"],

  },
  {

    a: [

    q: "9. Kamu paling nyaman jadi orang yang...",
    a: [
      ["dndy", "Perhatian ke orang terdekat"],

      ["noel", "Punya teman dekat yang bisa di ajak bercanda"]
    ]
  },
  {
    q: "10. Pilih kalimat yang paling cocok denganmu!",
    a: [
      ["dndy", "Tenang, aku jelasin semuanya biar kamu paham."],

      ["noel", "GUE NGGAK MARAH! LO YANG NYEBELIN!"]
    ]

];

let current = 0;
let scores = {};

function show(id) {
  ["home", "quiz", "result"].forEach(section => {
    document.getElementById(section).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
} 
<div class="member-photo">
  <img id="memberImage" src="" alt="SEEN member">
</div>


function startQuiz() {
  current = 0;
  scores = { dndy: 0, jason: 0, albian: 0, noel: 0 };
  show("quiz");
  renderQuestion();
  window.scrollTo(0, 0);
}

function renderQuestion() {
  const item = questions[current];

  document.getElementById("counter").textContent =
    `pertanyaan ${current + 1} dari ${questions.length}`;

  document.getElementById("bar").style.width =
    `${(current / questions.length) * 100}%`;

  document.getElementById("question").textContent = item.q;

  const container = document.getElementById("answers");
  container.innerHTML = "";

  item.a.forEach(([member, label]) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = label;
    button.onclick = () => chooseAnswer(member);
    container.appendChild(button);
  });
}

function chooseAnswer(member) {
  scores[member]++;
  current++;

  if (current < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("bar").style.width = "100%";

  const maxScore = Math.max(...Object.values(scores));
  const winners = Object.keys(scores).filter(
    member => scores[member] === maxScore
  );

  const winner = winners[Math.floor(Math.random() * winners.length)];
  const result = members[winner]; 
  showMemberPhoto(winner);

  document.getElementById("resultIcon").textContent = result.icon;
  document.getElementById("resultName").textContent = result.name;
  document.getElementById("resultTag").textContent = result.tag;
  document.getElementById("resultDesc").textContent = result.desc;
  document.getElementById("resultQuote").textContent = result.quote;

  show("result");
  window.scrollTo(0, 0);
}

function shareResult() {
  const name = document.getElementById("resultName").textContent;
  const text = `hasil kuis WHICH SEEN MEMBER ARE YOU? aku dapat ${name}! 💙 kamu dapat siapa? coba di sini: ${location.href}`;

  window.open(
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(text),
    "_blank"
  );
}
</script>
</body>
</html>
