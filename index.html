
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which SEEN Member Are You?</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #fff;
  background: linear-gradient(145deg, #a9dcff, #7289df, #e3dfff);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 35px 22px;
  border: 2px solid rgba(255,255,255,.8);
  border-radius: 28px;
  background: rgba(255,255,255,.18);
  box-shadow: 0 12px 40px #5266a755;
  backdrop-filter: blur(12px);
}

.star {
  font-size: 42px;
  margin-bottom: 12px;
}

.tag {
  font-size: 11px;
  letter-spacing: 4px;
  color: #eff8ff;
}

h1 {
  font-size: 35px;
  line-height: 1.15;
  text-shadow: 2px 3px #7184bc;
  margin: 18px 0;
}

p {
  line-height: 1.7;
  font-size: 14px;
}

button {
  border: 2px solid white;
  border-radius: 30px;
  padding: 15px 28px;
  margin-top: 18px;
  background: linear-gradient(90deg, #f8fdff, #b9dfff);
  color: #5268a8;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
}

button:active { transform: scale(.96); }

#quiz { display: none; }
</style>
</head>
<body>
<main class="card">
  <section id="home">
    <div class="star">✧･ﾟ: *✧･ﾟ:* ⭐</div>
    <div class="tag">WELCOME, SEEN!</div>
    <h1>WHICH SEEN<br>MEMBER ARE YOU?</h1>
    <p>Ready to discover your SEEN soulmate?<br>
    Answer the questions and find your match! ♡</p>
    <button onclick="startQuiz()">START QUIZ ✦</button>
    <p style="font-size:11px;letter-spacing:2px;">♡ MADE BY SEEN FANS ♡</p>
  </section>

  <section id="quiz">
    <div class="star">💿 ✦ 💙</div>
    <div class="tag">YOUR SEEN MATCH</div>
    <h1>COMING SOON!</h1>
    <p>Our quiz is getting ready.<br>Let's make something cute together!</p>
    <button onclick="goHome()">BACK HOME</button>
  </section>
</main>

<script>
function startQuiz() {
  document.getElementById("home").style.display = "none";
  document.getElementById("quiz").style.display = "block";
}
function goHome() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("home").style.display = "block";
}
</script>
</body>
</html>
