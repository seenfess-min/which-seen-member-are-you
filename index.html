
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which SEEN Member Are You?</title>

  <style>
    :root {
      --navy: #101B3D;
      --deep-blue: #263F73;
      --baby-blue: #B8D7F5;
      --silver: #DCE5F2;
      --white: #FFFFFF;
      --text: #172647;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at top right, #263F73 0%, transparent 40%),
        linear-gradient(145deg, #101B3D, #172A52 60%, #263F73);
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 620px;
      margin: auto;
    }

    .top-label {
      text-align: center;
      color: var(--baby-blue);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 43px);
      line-height: 1.15;
      letter-spacing: -1px;
    }

    .header h1 span {
      color: var(--baby-blue);
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--silver);
      font-size: 14px;
      line-height: 1.7;
    }

    .card {
      padding: 25px;
      border: 1px solid rgba(220, 229, 242, 0.65);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.97);
      color: var(--text);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.22);
    }

    .step-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--deep-blue);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .progress-track {
      height: 6px;
      border-radius: 99px;
      background: #E5EBF4;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #263F73, #8BBBEA);
      border-radius: 99px;
      transition: width 0.25s ease;
    }

    .question {
      margin: 0 0 22px;
      font-size: 22px;
      line-height: 1.4;
    }

    .answers {
      display: grid;
      gap: 11px;
    }

    .answer {
      width: 100%;
      padding: 15px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      line-height: 1.5;
      color: var(--text);
      background: #F7F9FC;
      border: 1.5px solid #DCE5F2;
      border-radius: 13px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .answer:hover {
      border-color: #7EADE0;
      background: #EFF6FF;
    }

    .answer.selected {
      border-color: var(--deep-blue);
      background: #E8F1FC;
      box-shadow: 0 0 0 2px rgba(38, 63, 115, 0.08);
    }

    .letter {
      width: 30px;
      height: 30px;
      min-width: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--deep-blue);
      background: var(--silver);
      font-weight: bold;
      font-size: 12px;
    }

    .answer.selected .letter {
      color: white;
      background: var(--deep-blue);
    }

    .navigation {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .nav-button {
      min-height: 46px;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--deep-blue);
      font-weight: bold;
      cursor: pointer;
    }

    .back-button {
      color: var(--deep-blue);
      background: white;
    }

    .next-button {
      flex: 1;
      color: white;
      background: var(--deep-blue);
    }

    .nav-button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .message {
      min-height: 18px;
      margin-top: 10px;
      text-align: center;
      color: #A33145;
      font-size: 12px;
    }

    .result {
      text-align: center;
    }

    .result-kicker {
      color: var(--deep-blue);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .result h2 {
      margin: 10px 0 18px;
      font-size: 30px;
      color: var(--navy);
    }

    .result-photo {
      display: block;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      margin: 0 auto 20px;
      border: 4px solid var(--silver);
      border-radius: 18px;
      background: #E8EEF7;
    }

    .member-title {
      margin: 0 0 18px;
      color: var(--deep-blue);
      font-size: 20px;
    }

    .result-description {
      color: #40516D;
      text-align: left;
      font-size: 14px;
      line-height: 1.9;
    }

    .result-description p {
      margin: 0 0 13px;
    }

    .restart-button {
      width: 100%;
      margin-top: 16px;
      min-height: 48px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      color: white;
      background: var(--deep-blue);
      font-weight: bold;
      cursor: pointer;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: var(--silver);
      font-size: 10px;
      letter-spacing: 2px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 420px) {
      .card {
        padding: 20px 16px;
      }

      .question {
        font-size: 20px;
      }

      .answer {
        padding: 13px 12px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="top-label">THE SEEN EXPERIENCE</div>

    <header class="header">
      <h1>WHICH SEEN<br><span>MEMBER ARE YOU?</span></h1>
      <p class="subtitle">
        7 questions. 4 personalities.<br>
        Let's find your SEEN match!
      </p>
    </header>

    <section class="card" id="quizCard">
      <div class="step-row">
        <span id="stepLabel">QUESTION 01</span>
        <span id="stepCount">01 / 07</span>
      </div>

      <div
        class="progress-track"
        role="progressbar"
        aria-label="Quiz progress"
        aria-valuemin="0"
        aria-valuemax="7"
        aria-valuenow="0"
        id="progressTrack"
      >
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <h2 class="question" id="questionText"></h2>
      <div class="answers" id="answers"></div>

      <div class="navigation">
        <button class="nav-button back-button" id="backButton" type="button">
          ← Back
        </button>
        <button class="nav-button next-button" id="nextButton" type="button">
          Next →
        </button>
      </div>

      <div class="message" id="message" aria-live="polite"></div>
    </section>

    <section class="card result hidden" id="resultCard">
      <div class="result-kicker">YOUR SEEN MATCH IS...</div>
      <h2 id="resultName"></h2>

      <img
        class="result-photo"
        id="resultPhoto"
        src=""
        alt="SEEN member"
      >

      <h3 class="member-title" id="resultTitle"></h3>

      <div class="result-description" id="resultDescription"></div>

      <button class="restart-button" id="restartButton" type="button">
        ↻ TAKE THE QUIZ AGAIN
      </button>
    </section>

    <footer class="footer">MADE WITH LOVE FOR SEEN ♡</footer>
  </main>

  <script>
    /*
      IMPORTANT:
      Put all four member photos in the same folder as index.html.
      Make sure each filename and file extension below match GitHub exactly.
    */

    const members = {
      dndy: {
        name: "DNDY",
        title: "THE MORNING ACHIEVER",
        photo: "dndy.jpg",
        description: [
          "Kamu tipe orang yang suka menjalani hari dengan penuh kegiatan. Buatmu, punya sesuatu untuk dilakukan bikin hari terasa lebih bermakna, apalagi kalau bisa memulai semuanya sejak pagi.",
          "Kamu merasa lebih nyaman ketika punya rencana dan aktivitas yang bisa dijalani. Hari yang produktif adalah caramu menikmati waktu dan membuat setiap hari terasa berarti."
        ]
      },

      jason: {
        name: "JASON",
        title: "THE ENERGETIC AFTERNOON",
        photo: "jason.jpg",
        description: [
          "Kamu punya energi yang gampang menular ke orang lain. Kamu mudah akrab dengan orang baru, suka mencoba hal-hal yang menarik, dan punya selera gaya yang membuatmu bebas mengekspresikan diri.",
          "Buatmu, hidup terasa lebih menyenangkan saat bisa bertemu orang baru, berbagi tawa, dan mencoba pengalaman berbeda. Kamu juga nggak takut menunjukkan sisi stylish dan kepribadianmu."
        ]
      },

      albian: {
        name: "ALBIAN",
        title: "THE UNEXPECTED SUNSET",
        photo: "albian.jpg",
        description: [
          "Kamu mungkin nggak selalu banyak bicara atau menunjukkan semua sisi dirimu kepada orang lain. Namun, di balik sikapmu yang pendiam, ada sisi humor yang muncul di saat tak terduga dan sering kali berhasil membuat orang di sekitarmu terkejut sekaligus tertawa.",
          "Kamu nggak harus selalu menjadi pusat perhatian untuk membuat orang mengingatmu. Justru sisi dirimu yang sulit ditebak itulah yang membuat orang ingin mengenalmu lebih jauh."
        ]
      },

      noel: {
        name: "NOEL",
        title: "THE CHILL NIGHT",
        photo: "noel.jpg",
        description: [
          "Kamu bisa menikmati kebersamaan dan mengobrol dengan orang lain tanpa harus selalu menjadi pusat perhatian. Kamu punya cara sendiri untuk menunjukkan kepribadianmu, dengan energi yang lebih santai tetapi tetap menyenangkan saat orang mengenalmu lebih dekat.",
          "Kamu tahu kapan harus ikut meramaikan suasana dan kapan cukup menikmati momen. Nggak harus paling ramai untuk bisa nyambung dengan orang lain dan meninggalkan kesan yang menyenangkan."
        ]
      }
    };

    const questions = [
      {
        question: "Kalau bangun di pagi hari, kamu biasanya…",
        answers: [
          { text: "Langsung bersiap dan mulai menjalani aktivitas.", member: "dndy" },
          { text: "Menikmati pagi dengan tenang sebelum mulai beraktivitas.", member: "albian" },
          { text: "Bangun santai dulu, baru memikirkan mau ngapain.", member: "noel" },
          { text: "Bangun dengan semangat dan siap menjalani hari.", member: "jason" }
        ]
      },
      {
        question: "Tiba-tiba kamu punya satu hari kosong tanpa rencana. Apa yang kamu lakukan?",
        answers: [
          { text: "Cari kegiatan seru atau ajak orang lain jalan.", member: "jason" },
          { text: "Lihat situasi dulu, kalau ada yang menarik baru ikut.", member: "noel" },
          { text: "Bikin jadwal kegiatan supaya hariku tetap produktif.", member: "dndy" },
          { text: "Menikmati waktu sendiri dan melakukan sesuatu sesuai mood.", member: "albian" }
        ]
      },
      {
        question: "Saat berada di lingkungan yang dipenuhi orang baru, kamu akan…",
        answers: [
          { text: "Mengamati suasana dulu sebelum mulai banyak bicara.", member: "albian" },
          { text: "Mengobrol kalau ada kesempatan, tapi nggak harus dengan semua orang.", member: "noel" },
          { text: "Langsung menyapa dan mencoba berkenalan dengan banyak orang.", member: "jason" },
          { text: "Fokus dengan kegiatanku sendiri sambil tetap ramah.", member: "dndy" }
        ]
      },
      {
        question: "Kalau memilih outfit untuk jalan-jalan, kamu lebih suka…",
        answers: [
          { text: "Casual dengan sentuhan unik yang sesuai kepribadianku.", member: "noel" },
          { text: "Stylish dan fashionable, suka bereksperimen dengan outfit.", member: "jason" },
          { text: "Santai dan simpel, nggak perlu terlalu mencolok.", member: "albian" },
          { text: "Nyaman dan praktis supaya bebas beraktivitas seharian.", member: "dndy" }
        ]
      },
      {
        question: "Teman-temanmu paling mungkin mengenalmu sebagai orang yang…",
        answers: [
          { text: "Ceria, penuh energi, dan gampang akrab dengan siapa saja.", member: "jason" },
          { text: "Teratur dan selalu punya sesuatu untuk dikerjakan.", member: "dndy" },
          { text: "Pendiam, tetapi kadang tingkahnya nggak terduga.", member: "albian" },
          { text: "Santai dan asyik diajak ngobrol tanpa harus selalu ramai.", member: "noel" }
        ]
      },
      {
        question: "Kalau sedang kumpul bersama teman-teman, kamu biasanya…",
        answers: [
          { text: "Ikut bercanda dan ngobrol, tetapi tetap dengan energiku sendiri.", member: "noel" },
          { text: "Lebih banyak mendengarkan, lalu tiba-tiba melontarkan sesuatu yang lucu.", member: "albian" },
          { text: "Mengajak melakukan sesuatu supaya waktu nggak terbuang sia-sia.", member: "dndy" },
          { text: "Menghidupkan suasana dan membuat semua orang ikut seru-seruan.", member: "jason" }
        ]
      },
      {
        question: "Pilih suasana yang paling menggambarkan dirimu!",
        answers: [
          { text: "Senja yang tenang dengan kejutan kecil yang menyenangkan.", member: "albian" },
          { text: "Pagi yang cerah, penuh rencana dan kesempatan baru.", member: "dndy" },
          { text: "Siang yang ramai, penuh tawa dan aktivitas seru.", member: "jason" },
          { text: "Malam yang santai, nyaman, dan penuh obrolan menarik.", member: "noel" }
        ]
      }
    ];

    let currentQuestion = 0;
    let selections = Array(questions.length).fill(null);

    const questionText = document.getElementById("questionText");
    const answersBox = document.getElementById("answers");
    const stepLabel = document.getElementById("stepLabel");
    const stepCount = document.getElementById("stepCount");
    const progressFill = document.getElementById("progressFill");
    const progressTrack = document.getElementById("progressTrack");
    const backButton = document.getElementById("backButton");
    const nextButton = document.getElementById("nextButton");
    const message = document.getElementById("message");
    const quizCard = document.getElementById("quizCard");
    const resultCard = document.getElementById("resultCard");

    function renderQuestion() {
      const question = questions[currentQuestion];

      stepLabel.textContent =
        "QUESTION " + String(currentQuestion + 1).padStart(2, "0");

      stepCount.textContent =
        String(currentQuestion + 1).padStart(2, "0") +
        " / " + String(questions.length).padStart(2, "0");

      progressFill.style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

      progressTrack.setAttribute("aria-valuenow", currentQuestion + 1);
      questionText.textContent = question.question;
      answersBox.replaceChildren();
      message.textContent = "";

      question.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";

        if (selections[currentQuestion] === index) {
          button.classList.add("selected");
        }

        const letter = document.createElement("span");
        letter.className = "letter";
        letter.textContent = String.fromCharCode(65 + index);

        const text = document.createElement("span");
        text.textContent = answer.text;

        button.append(letter, text);

        button.addEventListener("click", () => {
          selections[currentQuestion] = index;
          renderQuestion();
        });

        answersBox.appendChild(button);
      });

      backButton.disabled = currentQuestion === 0;
      nextButton.textContent =
        currentQuestion === questions.length - 1
          ? "See My Result →"
          : "Next →";
    }

    function showResult() {
      const scores = {
        dndy: 0,
        jason: 0,
        albian: 0,
        noel: 0
      };

      selections.forEach((selectedIndex, questionIndex) => {
        const answer = questions[questionIndex].answers[selectedIndex];
        scores[answer.member]++;
      });

      const highestScore = Math.max(...Object.values(scores));

      const winners = Object.keys(scores).filter(
        member => scores[member] === highestScore
      );

      const winnerId = winners[
        Math.floor(Math.random() * winners.length)
      ];

      const winner = members[winnerId];

      document.getElementById("resultName").textContent = winner.name;
      document.getElementById("resultTitle").textContent = winner.title;

      const photo = document.getElementById("resultPhoto");
      photo.src = winner.photo;
      photo.alt = winner.name + " - SEEN";

      photo.onerror = function () {
        this.onerror = null;
        this.alt = "Foto tidak ditemukan. Periksa nama file foto di GitHub.";
        this.style.display = "none";
      };

      const description = document.getElementById("resultDescription");
      description.replaceChildren();

      winner.description.forEach(paragraph => {
        const p = document.createElement("p");
        p.textContent = paragraph;
        description.appendChild(p);
      });

      quizCard.classList.add("hidden");
      resultCard.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    nextButton.addEventListener("click", () => {
      if (selections[currentQuestion] === null) {
        message.textContent = "Pilih satu jawaban dulu ya! ♡";
        return;
      }

      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
      } else {
        showResult();
      }
    });

    backButton.addEventListener("click", () => {
      if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
      }
    });

    document.getElementById("restartButton").addEventListener("click", () => {
      currentQuestion = 0;
      selections = Array(questions.length).fill(null);

      resultCard.classList.add("hidden");
      quizCard.classList.remove("hidden");

      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    renderQuestion();
  </script>
</body>
</html>
